apiVersion: apps/v1
kind: Deployment
metadata:
  name: intelligent-test-reviewer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: intelligent-test-reviewer
  template:
    metadata:
      labels:
        app: intelligent-test-reviewer
    spec:
      containers:
        - name: reviewer
          image: intelligent-test-reviewer:latest
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-keys
                  key: openai-api-key
