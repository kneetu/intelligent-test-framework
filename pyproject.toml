[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-test-framework"
version = "0.1.0"
description = "Multi-module framework for PRD-driven test case generation and review"
readme = "README.md"
requires-python = ">=3.10,<3.13"

[tool.black]
line-length = 100
target-version = ["py310"]
include = '\.pyi?$'
exclude = '''
/(
    \.cursor
  | \.git
  | \.venv
  | venv
  | k8s
  | __pycache__
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "W", "UP", "B", "C4"]
ignore = []
exclude = [".cursor", ".git", ".venv", "venv", "k8s", "__pycache__"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
